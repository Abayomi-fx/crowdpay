name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fail if any .env file is tracked by git
        run: node .husky/check-env.js --tracked

  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: crowdpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: ./backend
        run: |
          npm audit --omit=dev --audit-level=high || (echo "Vulnerability scan completed with findings; reviewing suppression file" && exit 0)

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: |
          npm audit --omit=dev --audit-level=high || (echo "Vulnerability scan completed with findings; reviewing suppression file" && exit 0)

      - name: Check dependency vulnerability suppressions
        working-directory: ./backend
        run: node ../scripts/check-vuln-suppressions.js || exit 1

      - name: Check dependency vulnerability suppressions
        working-directory: ./frontend
        run: node ../scripts/check-vuln-suppressions.js || exit 1

      - name: Run linter
        working-directory: ./backend
        run: npm run lint

      - name: Check formatting
        working-directory: ./backend
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check

      - name: Check for blanket eslint-disable
        working-directory: ./backend
        run: |
          if grep -r "/\* eslint-disable \*/" --include="*.js" src/; then
            echo "ERROR: Found blanket eslint-disable comments (/* eslint-disable */). Use eslint-disable-next-line or eslint-disable-line with a reason instead."
            exit 1
          fi

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/crowdpay_test
        run: npm run migrate

      - name: Upgrade production-like migration fixture in a disposable database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/crowdpay_test
        run: npm run test:migration-upgrade

      - name: Verify schema.sql and migrations converge (migrate:fresh flow)
        working-directory: ./backend
        env:
          PGPASSWORD: password
          DATABASE_URL_SCHEMA_CHECK: postgresql://postgres:password@localhost:5432/crowdpay_schema_check
        run: |
          createdb -h localhost -U postgres crowdpay_schema_check
          DATABASE_URL="$DATABASE_URL_SCHEMA_CHECK" npm run migrate:fresh
          DATABASE_URL="$DATABASE_URL_SCHEMA_CHECK" npm run verify-schema

      - name: Compare migration-only and schema bootstrap snapshots
        working-directory: ./backend
        env:
          DATABASE_URL_MIGRATION_CHECK: postgresql://postgres:password@localhost:5432/crowdpay_test
          DATABASE_URL_SCHEMA_CHECK: postgresql://postgres:password@localhost:5432/crowdpay_schema_check
        run: |
          DATABASE_URL="$DATABASE_URL_MIGRATION_CHECK" npm run verify-schema -- --write-snapshot "$RUNNER_TEMP/migrations.json"
          DATABASE_URL="$DATABASE_URL_SCHEMA_CHECK" npm run verify-schema -- --compare-snapshot "$RUNNER_TEMP/migrations.json"
          dropdb -h localhost -U postgres crowdpay_schema_check

      - name: Run test suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/crowdpay_test
          JWT_SECRET: testsecret
          PLATFORM_SECRET_KEY: SCVMQUS5EMTHWBLJTE5XCSCMHB2ZOVKRR4ATVTRPUNRCOGKRENIL3LHR
          STELLAR_NETWORK: testnet
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          WALLET_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ENABLE_CAMPAIGN_STATUS_CRON: "false"
        run: npm test

  performance-budgets:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: crowdpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install k6
        run: |
          K6_VERSION=v0.54.0
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Migrate and seed representative data
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/crowdpay_test
          PGPASSWORD: password
        run: |
          npm run migrate
          psql -h localhost -U postgres -d crowdpay_test -f db/seed.sql

      - name: Validate performance budgets and exceptions
        run: node load-tests/budget-check.js --validate

      - name: Start backend for performance test
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://postgres:password@localhost:5432/crowdpay_test
          REDIS_URL: redis://localhost:6379
          WORKER_ENABLED: "false"
          JWT_SECRET: testsecret
          JWT_ISSUER: crowdpay-test
          JWT_AUDIENCE: crowdpay-test
          API_KEY_PEPPER: test-pepper
          PLATFORM_SECRET_KEY: SCVMQUS5EMTHWBLJTE5XCSCMHB2ZOVKRR4ATVTRPUNRCOGKRENIL3LHR
          ARBITRATOR_SECRET_KEY: SCVMQUS5EMTHWBLJTE5XCSCMHB2ZOVKRR4ATVTRPUNRCOGKRENIL3LHR
          WALLET_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          OPS_API_KEY: test-ops-key
          UNSUBSCRIBE_SECRET: test-unsubscribe-secret
          IMPACT_SIGNING_SECRET: test-impact-secret
          STELLAR_NETWORK: testnet
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        run: |
          node src/index.js > /tmp/backend-perf.log 2>&1 &
          echo $! > /tmp/backend-perf.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health/live > /dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend-perf.log
          exit 1

      - name: Run campaign discovery and checkout budget test
        continue-on-error: true
        run: |
          k6 run --summary-export "$RUNNER_TEMP/k6-summary.json" \
            -e BASE_URL=http://127.0.0.1:3001 \
            -e PERF_PROFILE=ci \
            load-tests/performance-budgets.js

      - name: Report regressions against baseline
        run: |
          node load-tests/budget-check.js \
            --summary "$RUNNER_TEMP/k6-summary.json" \
            --config load-tests/performance-budgets.json \
            --baseline load-tests/performance-baseline.json

      - name: Upload performance summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: performance-summary
          path: |
            ${{ runner.temp }}/k6-summary.json
            /tmp/backend-perf.log
          if-no-files-found: ignore
          retention-days: 7

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Check formatting
        working-directory: ./frontend
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check

      - name: Check for blanket eslint-disable
        working-directory: ./frontend
        run: |
          if grep -r "/\* eslint-disable \*/" --include="*.js" --include="*.jsx" src/; then
            echo "ERROR: Found blanket eslint-disable comments (/* eslint-disable */). Use eslint-disable-next-line or eslint-disable-line with a reason instead."
            exit 1
          fi

      - name: Run unit tests
        working-directory: ./frontend
        run: npm test

      - name: Run build
        working-directory: ./frontend
        env:
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Check JavaScript payload budget
        working-directory: ./frontend
        run: node ../load-tests/budget-check.js --dist dist

  # -----------------------------------------------------------------------
  # smoke-tests: Deterministic Playwright checks against mocked public
  # routes. No PostgreSQL, Stellar testnet, or external API calls are made;
  # all backend traffic is intercepted inside the browser by the spec's
  # page.route() handler.
  #
  # This job is intended to be a REQUIRED status check in repository
  # branch-protection settings (Settings → Branches → Require status
  # checks → "smoke-tests"). Add it there once the first run passes.
  # -----------------------------------------------------------------------
  smoke-tests:
    runs-on: ubuntu-latest
    # Run after frontend dependencies are known to install and build cleanly,
    # so we don't waste Chromium download time on a broken frontend.
    needs: frontend-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Root lock-file owns @playwright/test; frontend lock-file owns vite.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies (@playwright/test)
        run: npm ci

      - name: Install frontend dependencies (vite dev server)
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Chromium browser + OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run public smoke tests
        run: npm run test:public

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Upload Playwright screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/**/*.png
          retention-days: 7

  soroban-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run cargo test
        working-directory: ./contracts/soroban
        run: cargo test --workspace

      - name: Build contracts
        working-directory: ./contracts/soroban
        run: cargo build --release --target wasm32-unknown-unknown
